name: UI and catalog checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalog-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check scripts/test-regressions.mjs
          node --check scripts/test-ui-regressions.mjs
          node --check scripts/test-ui-browser.mjs
      - name: Validate catalog and UX regression
        run: |
          node scripts/validate-data.mjs
          node scripts/test-regressions.mjs
          node scripts/test-ui-regressions.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify browser UI/UX
        run: node scripts/test-ui-browser.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
